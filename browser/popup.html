<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>AKSK Manager</title>
<style>
body{margin:0;width:280px;padding:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1f2a26;background:#fff}
#site{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{margin:2px 0 10px;font-size:12px;color:#6b7d76}
main{display:flex;flex-direction:column;gap:8px}
section{padding:10px;border:1px solid rgba(18,47,38,.1);border-radius:10px;background:#f7faf9}
section p{margin:0 0 8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
section button{margin:0 6px 0 0;padding:5px 12px;border:1px solid rgba(18,47,38,.15);border-radius:7px;background:#fff;color:#1f2a26;font:500 12px inherit;cursor:pointer}
section button:hover{background:#eef5f2;border-color:#7fa597}
section button:active{background:#e1ede8}
</style>
<body><strong id="site"></strong>
<p id="status" role="status">正在读取网站账号…</p><main></main><script src="popup.js"></script></body></html>
