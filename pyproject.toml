[project]
name = "aksk-manager"
version = "0.1.0"
description = "Local Codex secret manager backed by Apple's synchronizable Keychain"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp>=1.26,<2", "platformdirs>=4,<5"]

[project.scripts]
aksk-manager = "aksk_manager.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aksk_manager"]

[tool.hatch.build.targets.wheel.force-include]
"src/aksk_manager/ui/index.html" = "aksk_manager/ui/index.html"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
