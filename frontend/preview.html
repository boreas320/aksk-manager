<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AKSK Manager · 实时预览</title></head>
<body>
  <header class="preview-toolbar">
    <div class="preview-title"><strong>AKSK Manager <span>实时预览</span></strong><small>仅使用内存演示数据 · 不连接钥匙串 · 请勿填写真实密钥</small></div>
    <div class="preview-controls">
      <label>尺寸<select id="viewport"><option value="full">桌面</option><option value="768">平板 768</option><option value="390">手机 390</option></select></label>
      <label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>状态<select id="scenario"><option value="normal">正常</option><option value="empty">空列表</option><option value="blocked">组件不可用</option><option value="conflict">编辑冲突</option></select></label>
      <button id="reset">重置演示数据</button>
    </div>
  </header>
  <main class="preview-stage"><iframe title="AKSK Manager 预览" allow="clipboard-write"></iframe></main>
  <script type="module" src="/preview/main.ts"></script>
</body></html>
